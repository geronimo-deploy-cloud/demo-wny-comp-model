[project]
name = "expected-transaction-price"
version = "1.0.0"
description = "ML model serving API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geronimo>=0.5.0",
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "boto3>=1.34.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "fastmcp>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "xgboost>=2.0.3",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.42.0",
    "playwright-stealth>=1.0.6",
    "pyzill>=1.0.3",
    "h3>=4.5.0",
    "pyarrow>=24.0.0",
    "pytest>=7.4.0",
    "httpx>=0.25.0",
    "pytest-cov>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
