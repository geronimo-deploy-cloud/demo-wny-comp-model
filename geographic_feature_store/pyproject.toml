[project]
name = "geographic-feature-store"
version = "1.0.0"
description = "Batch pipeline for precomputing geographic velocity features (sales volume, median PPSF) across WNY metro areas."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geronimo>=0.4.0",
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "requests>=2.31.0",
    "h3>=4.0.0",
    "pyarrow>=14.0.0",
    "metaflow>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
